# Optional named-bar configuration. After review, install as /etc/tiny-dfr/config.toml.
# Global appearance/brightness options continue to inherit from config.toml.
DefaultLayer = "home"
# Optional: holding Fn temporarily shows this bar; releasing Fn returns to the
# previous bar. Tapping a navigation button during Fn keeps the chosen bar open.
FnLayer = "function"

[[Layers]]
Name = "home"
Keys = [
    { Icon = "volume_down", Action = "VolumeDown" },
    { Icon = "volume_off", Action = "Mute" },
    { Icon = "volume_up", Action = "VolumeUp" },
    { Icon = "brightness_low", Action = "BrightnessDown" },
    { Icon = "brightness_high", Action = "BrightnessUp" },
    { Icon = "play_pause", Action = "PlayPause" },
    { Icon = "mic_off", Action = { Command = "voice-dictate start", Layer = "recording" } },
    { Text = "F1-F12", Action = { Layer = "function" } },
    { Text = "Media", Action = { Layer = "media" } },
    { Battery = "both", Stretch = 2 },
    { Time = "%H:%M", Stretch = 2 },
]

[[Layers]]
Name = "function"
Keys = [
    { Text = "Home", Action = { Layer = "home" } },
    { Text = "F1", Action = "F1" },
    { Text = "F2", Action = "F2" },
    { Text = "F3", Action = "F3" },
    { Text = "F4", Action = "F4" },
    { Text = "F5", Action = "F5" },
    { Text = "F6", Action = "F6" },
    { Text = "F7", Action = "F7" },
    { Text = "F8", Action = "F8" },
    { Text = "F9", Action = "F9" },
    { Text = "F10", Action = "F10" },
    { Text = "F11", Action = "F11" },
    { Text = "F12", Action = "F12" },
]

[[Layers]]
Name = "media"
Keys = [
    { Text = "Home", Action = { Layer = "home" } },
    { Icon = "fast_rewind", Action = "PreviousSong" },
    { Icon = "play_pause", Action = "PlayPause" },
    { Icon = "fast_forward", Action = "NextSong" },
    { Icon = "volume_off", Action = "Mute" },
    { Icon = "volume_down", Action = "VolumeDown" },
    { Icon = "volume_up", Action = "VolumeUp" },
]

# Voice dictation: the home-bar mic button runs `voice-dictate start` and
# opens this recording layer in one press; the layer itself is the visual
# state. Stop keeps the recording and types the transcript into the focused
# window, Cancel discards a mis-start; both run their command and return
# home. The helper is machine-local wiring and is not shipped with the
# daemon (see README); without it these presses still switch layers and
# log the failed command.
[[Layers]]
Name = "recording"
Keys = [
    { Text = "Cancel", Action = { Command = "voice-dictate cancel", Layer = "home" } },
    { Text = "Recording", Stretch = 3 },
    { Text = "Stop", Action = { Command = "voice-dictate stop", Layer = "home" } },
]

# To extend the deck, add another [[Layers]] with a unique Name and nonempty Keys,
# then add a button with Action = { Layer = "that-name" } to a reachable bar.
# A Home button is inserted automatically on sub-bars that lack a visible
# button targeting DefaultLayer; a button can also run a shell command on
# touch-down with Action = { Command = "..." }, optionally combined with a
# Layer switch as in the mic button above. Commands run through /bin/sh as
# the daemon user; failures are logged to the journal. With PetEnabled (see
# config.toml) the home bar also gains a Pet button opening the daemon's own
# pet layer, unless a layer named "pet" is defined here.
