# The dfr-deck's seeded color themes, in cycle and picker order.
# This file is embedded in the daemon as the built-in theme set; it is
# not installed or read at runtime. Owners add or override themes in
# /etc/tiny-dfr/config.toml with the same shape:
#
#   [Themes.Mine]
#   [Themes.Mine.Accents]
#   Cyan = "#30D4F2"
#   [[Themes.Mine.DayCycleBands]]
#   Name = "day"
#   StartHour = 12
#   Color = "#1A1B1E"
#
# Every accent keeps enough brightness for white labels and dark fills,
# and the semantic families (cyan audio, amber brightness, violet
# navigation, warning orange, critical red, charging green) stay
# pairwise distinct so the deck's color language survives every preset.

# The live palette exactly as the deck has always rendered it: no
# overrides, the shipped accents and the configured day cycle.
[[Theme]]
Name = "Default"

# Deep cool blues: icy accents over a blue-black strip.
[[Theme]]
Name = "Midnight"
[Theme.Accents]
neutral = "#8FA3C8"
cyan = "#62D0F5"
amber = "#FFC46B"
blue = "#8CACFF"
violet = "#9D8CFF"
orange = "#FF9A57"
red = "#FF647E"
green = "#5FE3A8"
[[Theme.DayCycleBands]]
Name = "morning"
StartHour = 5
Color = "#0A1018"
[[Theme.DayCycleBands]]
Name = "day"
StartHour = 12
Color = "#0D1522"
[[Theme.DayCycleBands]]
Name = "evening"
StartHour = 17
Color = "#101A2E"
[[Theme.DayCycleBands]]
Name = "night"
StartHour = 21
Color = "#050810"

